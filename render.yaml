services:
  - type: web
    name: ibranson-price-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Standard, not Starter: Branson.com's "browser" source launches a real
    # headless Chromium per check (see adapters/browserAdapter.ts), which
    # alone commonly uses 150-300MB+ — on top of Node/Express/Prisma, that's
    # tight-to-over Starter's ~512MB and risks the service getting OOM-killed
    # mid-check. If cost matters more than that headroom, Starter *might*
    # work since Chromium only runs briefly once per poll interval rather
    # than continuously — but a crash-looping service is a worse outcome
    # than the extra monthly cost, so Standard is the safer default here.
    plan: standard # persistent disks (below) require Starter or above — Free won't keep the SQLite db across deploys/restarts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/prod.db
      - key: POLL_INTERVAL_MINUTES
        value: "5"
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
